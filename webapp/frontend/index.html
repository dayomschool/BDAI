<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FDS 위험거래 탐지 데모</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div class="badge">FDS Fraud Detection Demo</div>
      <h1 id="mainTitle">FDS 위험 거래 탐지 데모</h1>
      <p class="subtitle" id="mainSubtitle">거래 데이터를 넣으면 LightGBM 모델이 실시간으로 정상/이상 거래를 판별합니다.</p>
    </header>

    <section class="upload-card" id="uploadCard">
      <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">📄</div>
        <p class="dropzone-title">CSV 파일을 여기에 끌어다 놓거나 클릭해서 선택하세요</p>
        <p class="dropzone-hint">모델이 한 번도 학습에 쓰지 않은 홀드아웃 테스트 데이터를 넣어보세요</p>
        <input type="file" id="fileInput" accept=".csv" hidden />
      </div>

      <div class="divider"><span>또는</span></div>

      <button class="sample-btn" id="sampleBtn">
        샘플 데이터로 바로 체험하기
      </button>
      <p class="sample-hint">직접 준비한 데이터가 없다면, 모델이 한 번도 보지 못한 실제 테스트 데이터 40건으로 바로 확인해보세요.</p>

      <p class="error-msg" id="errorMsg"></p>
    </section>

    <section class="loading" id="loading" hidden>
      <div class="spinner"></div>
      <p class="loading-text" id="loadingText">모델이 거래를 분석하고 있습니다...</p>
    </section>

    <section class="results" id="results" hidden>
      <div class="results-header">
        <button class="reset-btn" id="resetBtn">다시 분석하기</button>
      </div>

      <div class="summary-bar" id="summaryBar"></div>

      <div class="result-list" id="resultList"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
